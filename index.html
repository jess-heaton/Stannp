<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stannp Chatbot Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
            color: #333;
            margin: 0;
            padding: 0;
        }
        main {
            margin: 50px auto;
            max-width: 800px;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        p {
            font-size: 1.1em;
            line-height: 1.6;
            text-align: left;
        }
        .bold {
            font-weight: bold;
        }
        #flat-chat {
            width: 80%;
            height: 600px;
            border: 1px solid #ccc;
            border-radius: 12px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <main>
        <h1>Stannp Demo</h1>
        <div id="flat-chat"></div>
    </main>

    <script>
      const FormExtension = {
        name: 'Forms',
        type: 'response',
        match: ({ trace }) =>
          trace.type === 'Custom_Form' || trace.payload.name === 'Custom_Form',
        render: ({ trace, element }) => {
          const formContainer = document.createElement('form');
          formContainer.innerHTML = `
            <style>
              label {
                font-size: 0.8em;
                color: #888;
              }
              input[type="text"], input[type="email"], input[type="tel"] {
                width: 100%;
                border: none;
                border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
                background: transparent;
                margin: 5px 0;
                outline: none;
                padding: 8px 0;
              }
              .submit {
                background: linear-gradient(to right, #2e6ee1, #2e7ff1);
                border: none;
                color: white;
                padding: 10px;
                border-radius: 5px;
                width: 100%;
                cursor: pointer;
              }
            </style>

            <label for="name">Name</label>
            <input type="text" class="name" name="name" required>

            <label for="phone">Phone Number</label>
            <input type="tel" class="phone" name="phone" required>

            <label for="email">Work Email</label>
            <input type="email" class="email" name="email" required>

            <label for="company">Company Name</label>
            <input type="text" class="company" name="company" required>

            <input type="submit" class="submit" value="Submit">
          `;

          formContainer.addEventListener('submit', (event) => {
            event.preventDefault();
            const data = {
              name: formContainer.querySelector('.name').value,
              phone: formContainer.querySelector('.phone').value,
              email: formContainer.querySelector('.email').value,
              company: formContainer.querySelector('.company').value,
            };
            window.voiceflow.chat.interact({ type: 'complete', payload: data });
          });

          element.appendChild(formContainer);
        },
      };

      // Load the pop-up chat widget
      (function(d, t) {
        const v = d.createElement(t);
        v.src = 'https://cdn.voiceflow.com/widget/bundle.mjs';
        v.type = 'text/javascript';
        v.onload = () => {
          window.voiceflow.chat.load({
            verify: { projectID: '6760adeb289aab95d4721254' },
            url: 'https://general-runtime.voiceflow.com',
            versionID: 'production',
            assistant: { extensions: [FormExtension] },
          });
        };
        d.head.appendChild(v);
      })(document, 'script');

      // Load the embedded chat widget
      (function(d, t) {
        const v = d.createElement(t);
        v.src = 'https://cdn.voiceflow.com/widget/bundle.mjs';
        v.type = 'text/javascript';
        v.onload = () => {
          window.voiceflow.chat.load({
            verify: { projectID: '6760adeb289aab95d4721254' },
            url: 'https://general-runtime.voiceflow.com',
            versionID: 'production',
            render: {
              mode: 'embedded',
              target: document.getElementById('flat-chat'),
            },
            autostart: true,
            assistant: { extensions: [FormExtension] },
          });
        };
        d.head.appendChild(v);
      })(document, 'script');
    </script>
</body>
</html>
