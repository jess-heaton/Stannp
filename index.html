
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initiate Phone Call</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 30px;
            flex-wrap: wrap;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            transform: translateY(0);
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            transform: scale(1.02);
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #667eea;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* VAPI Control Styles */
        .vapi-container {
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .btn-start {
            background: #4CAF50;
            color: white;
        }

        .btn-start:hover:not(:disabled) {
            background: #45a049;
            transform: translateY(-2px);
        }

        .btn-stop {
            background: #f44336;
            color: white;
        }

        .btn-stop:hover:not(:disabled) {
            background: #da190b;
            transform: translateY(-2px);
        }

        .btn-mute {
            background: #ff9800;
            color: white;
        }

        .btn-mute:hover:not(:disabled) {
            background: #e68900;
            transform: translateY(-2px);
        }

        .btn-mute.muted {
            background: #607d8b;
        }

        .btn-mute.muted:hover:not(:disabled) {
            background: #546e7a;
        }

        .btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }

        .vapi-status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 600;
        }

        .vapi-status.idle {
            background: #e3f2fd;
            color: #1976d2;
        }

        .vapi-status.active {
            background: #e8f5e8;
            color: #2e7d32;
        }

        .vapi-status.error {
            background: #ffebee;
            color: #c62828;
        }

        .microphone-indicator {
            margin-top: 20px;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .microphone-indicator.unmuted {
            background: #e8f5e8;
            color: #2e7d32;
        }

        .microphone-indicator.muted {
            background: #ffebee;
            color: #c62828;
        }

        .assistant-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #555;
        }

        .vapi-btn {
            display: none !important;
        }

        .permission-note {
            background: #fff3e0;
            color: #ef6c00;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            border-left: 4px solid #ff9800;
        }
    </style>
</head>
<body>
    <!-- Form Container -->
    <div class="container">
        <h1>📞 Initiate Call</h1>
        <form id="callForm">
            <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <input 
                    type="tel" 
                    id="phoneNumber" 
                    name="phoneNumber" 
                    placeholder="+447435900035" 
                    required
                >
            </div>
            
            <div class="form-group">
                <label for="language">Language</label>
                <select id="language" name="language" required>
                    <option value="">Select a language</option>
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="pt">Portuguese</option>
                    <option value="zh">Chinese</option>
                    <option value="ja">Japanese</option>
                    <option value="ko">Korean</option>
                    <option value="ar">Arabic</option>
                    <option value="hi">Hindi</option>
                    <option value="ru">Russian</option>
                </select>
            </div>
            
            <button type="submit">Send Details</button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                Sending details...
            </div>
            
            <div class="status" id="status"></div>
        </form>
    </div>

    <!-- VAPI Control Container -->
    <div class="container vapi-container">
        <h1>🎤 Start Your Call</h1>
        <p>Start your side of the call to begin translation</p>
        
        <div class="permission-note" id="permissionNote" style="display: none;">
            Please allow microphone access when prompted to use the voice assistant.
        </div>
        
        <div class="assistant-info">
            <strong>Assistant ID:</strong> ad8fb8db-1cc3-4162-8ff1-d88d75a1f930
        </div>

        <div class="controls">
            <button id="startBtn" class="btn btn-start">Start Call</button>
            <button id="stopBtn" class="btn btn-stop" disabled>Stop Call</button>
            <button id="muteBtn" class="btn btn-mute" disabled>Mute</button>
        </div>

        <div id="vapiStatus" class="vapi-status idle">Ready to start</div>
        <div id="micStatus" class="microphone-indicator unmuted" style="display: none;">🎤 Microphone: Unmuted</div>
    </div>

    <script>
        // Generate unique session ID
        function generateSessionId() {
            return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
        
        const sessionId = generateSessionId();
        console.log('Session ID:', sessionId);
        
        // Display session ID on page
        document.addEventListener('DOMContentLoaded', function() {
            const sessionDisplay = document.createElement('div');
            sessionDisplay.style.cssText = 'position: fixed; top: 20px; left: 20px; background: rgba(0,0,0,0.8); color: white; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 12px; z-index: 1000;';
            sessionDisplay.textContent = 'Session ID: ' + sessionId;
            document.body.appendChild(sessionDisplay);
        });

        // Form functionality
        document.getElementById('callForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const phoneNumber = document.getElementById('phoneNumber').value;
            const language = document.getElementById('language').value;
            const loadingEl = document.getElementById('loading');
            const statusEl = document.getElementById('status');
            const submitBtn = e.target.querySelector('button[type="submit"]');
            
            // Show loading state
            loadingEl.style.display = 'block';
            statusEl.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';
            
            try {
                const response = await fetch('https://hook.eu2.make.com/4p85atu737lio2v4kguah55x3rd7rfyq', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        phoneNumber: phoneNumber,
                        language: language,
                        sessionId: sessionId
                    })
                });
                
                if (response.ok) {
                    statusEl.textContent = '✅ Details sent successfully!';
                    statusEl.className = 'status success';
                    statusEl.style.display = 'block';
                    
                    // Reset form
                    document.getElementById('callForm').reset();
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
            } catch (error) {
                console.error('Error:', error);
                statusEl.textContent = '❌ Failed to send details. Please try again.';
                statusEl.className = 'status error';
                statusEl.style.display = 'block';
            } finally {
                // Hide loading state
                loadingEl.style.display = 'none';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Details';
            }
        });
        
        // Format UK phone number as user types
        document.getElementById('phoneNumber').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 0 && !value.startsWith('44')) {
                if (value.startsWith('0')) {
                    value = '44' + value.substring(1);
                } else if (value.length === 10) {
                    value = '44' + value;
                }
            }
            if (value.length > 0) {
                value = '+' + value;
            }
            e.target.value = value;
        });

        // VAPI functionality
        let vapiInstance = null;
        
        // DOM elements for VAPI
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const muteBtn = document.getElementById('muteBtn');
        const vapiStatus = document.getElementById('vapiStatus');
        const micStatus = document.getElementById('micStatus');
        const permissionNote = document.getElementById('permissionNote');
        
        // State tracking
        let isCallActive = false;
        let isMuted = false;
        let isVapiLoaded = false;
        let microphonePermissionGranted = false;
        
        // Check microphone permissions proactively
        async function checkMicrophonePermission() {
            try {
                const permissionResult = await navigator.permissions.query({ name: 'microphone' });
                microphonePermissionGranted = permissionResult.state === 'granted';
                
                if (permissionResult.state === 'prompt') {
                    permissionNote.style.display = 'block';
                } else {
                    permissionNote.style.display = 'none';
                }
                
                // Listen for permission changes
                permissionResult.addEventListener('change', () => {
                    microphonePermissionGranted = permissionResult.state === 'granted';
                    if (permissionResult.state === 'granted') {
                        permissionNote.style.display = 'none';
                    }
                });
                
                return microphonePermissionGranted;
            } catch (error) {
                console.log('Permission API not supported or error:', error);
                return false;
            }
        }
        
        // Request microphone permission explicitly
        async function requestMicrophonePermission() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                stream.getTracks().forEach(track => track.stop()); // Clean up immediately
                microphonePermissionGranted = true;
                permissionNote.style.display = 'none';
                return true;
            } catch (error) {
                console.error('Microphone permission denied:', error);
                microphonePermissionGranted = false;
                return false;
            }
        }
        
        // Update UI based on call state
        function updateUI() {
            startBtn.disabled = isCallActive || !isVapiLoaded;
            stopBtn.disabled = !isCallActive;
            muteBtn.disabled = !isCallActive;
            
            if (isCallActive) {
                micStatus.style.display = 'block';
                updateMuteStatus();
            } else {
                micStatus.style.display = 'none';
            }
        }
        
        // Update mute button and indicator with proper synchronization
        function updateMuteStatus() {
            if (vapiInstance && isCallActive) {
                // Use a small delay to ensure VAPI state is updated
                setTimeout(() => {
                    try {
                        isMuted = vapiInstance.isMuted();
                        muteBtn.textContent = isMuted ? 'Unmute' : 'Mute';
                        muteBtn.classList.toggle('muted', isMuted);
                        
                        micStatus.textContent = isMuted ? '🔇 Microphone: Muted' : '🎤 Microphone: Unmuted';
                        micStatus.classList.toggle('muted', isMuted);
                        micStatus.classList.toggle('unmuted', !isMuted);
                    } catch (error) {
                        console.error('Error checking mute status:', error);
                    }
                }, 100);
            }
        }
        
        // Manual start call function
        async function startCall() {
            if (!vapiInstance) {
                vapiStatus.textContent = 'VAPI not initialized yet, please wait...';
                vapiStatus.className = 'vapi-status error';
                return;
            }
            
            // Check and request microphone permission before starting call
            if (!microphonePermissionGranted) {
                const permissionGranted = await requestMicrophonePermission();
                if (!permissionGranted) {
                    vapiStatus.textContent = 'Microphone permission required to start call';
                    vapiStatus.className = 'vapi-status error';
                    return;
                }
            }
            
            try {
                vapiStatus.textContent = 'Connecting...';
                vapiStatus.className = 'vapi-status idle';
                
                // Pass session ID in metadata when starting VAPI call
                await vapiInstance.start('ad8fb8db-1cc3-4162-8ff1-d88d75a1f930', {
                    metadata: {
                        sessionId: sessionId
                    }
                });
                
            } catch (error) {
                console.error('Failed to start call:', error);
                vapiStatus.textContent = 'Failed to start call: ' + error.message;
                vapiStatus.className = 'vapi-status error';
            }
        }
        
        // Manual stop call function
        function stopCall() {
            if (vapiInstance) {
                try {
                    vapiInstance.stop();
                } catch (error) {
                    console.error('Error stopping call:', error);
                }
            }
        }
        
        // Toggle mute function with better error handling
        function toggleMute() {
            if (vapiInstance && isCallActive) {
                try {
                    const currentMuteState = vapiInstance.isMuted();
                    const newMuteState = !currentMuteState;
                    vapiInstance.setMuted(newMuteState);
                    
                    // Update UI immediately, then verify after a delay
                    updateMuteStatus();
                } catch (error) {
                    console.error('Error toggling mute:', error);
                    vapiStatus.textContent = 'Error toggling mute: ' + error.message;
                    vapiStatus.className = 'vapi-status error';
                }
            }
        }
        
        // Event listeners for buttons
        startBtn.addEventListener('click', startCall);
        stopBtn.addEventListener('click', stopCall);
        muteBtn.addEventListener('click', toggleMute);
        
        // Function to set up VAPI event listeners
        function setupVapiEvents(vapi) {
            vapi.on('call-start', () => {
                console.log('Call started');
                isCallActive = true;
                vapiStatus.textContent = 'Call active - You can now speak!';
                vapiStatus.className = 'vapi-status active';
                updateUI();
                // Initialize mute status after call starts
                setTimeout(updateMuteStatus, 200);
            });
            
            vapi.on('call-end', () => {
                console.log('Call ended');
                isCallActive = false;
                isMuted = false; // Reset mute state
                vapiStatus.textContent = 'Call ended';
                vapiStatus.className = 'vapi-status idle';
                updateUI();
            });
            
            vapi.on('speech-start', () => {
                console.log('Assistant started speaking');
                if (isCallActive) {
                    vapiStatus.textContent = 'Assistant is speaking...';
                }
            });
            
            vapi.on('speech-end', () => {
                console.log('Assistant finished speaking');
                if (isCallActive) {
                    vapiStatus.textContent = 'Call active - You can now speak!';
                }
            });
            
            vapi.on('volume-level', (volume) => {
                console.log('Volume level:', volume);
            });
            
            vapi.on('message', (message) => {
                console.log('Message received:', message);
                
                // Check for specific message types that might affect mute state
                if (message.type === 'status-update' || message.type === 'speech-update') {
                    // Delay to ensure VAPI internal state is updated
                    setTimeout(updateMuteStatus, 50);
                }
            });
            
            vapi.on('error', (error) => {
                console.error('VAPI Error:', error);
                vapiStatus.textContent = 'Error: ' + error.message;
                vapiStatus.className = 'vapi-status error';
                isCallActive = false;
                isMuted = false;
                updateUI();
            });
        }
        
        // Initialize everything when page loads
        async function initialize() {
            // Check microphone permission on page load
            await checkMicrophonePermission();
            updateUI();
        }
        
        // Call initialize when page loads
        initialize();
    </script>

    <!-- Load VAPI using their HTML script tag method -->
    <script>
        (function (d, t) {
            var g = document.createElement(t),
                s = d.getElementsByTagName(t)[0];
            g.src = "https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js";
            g.defer = true;
            g.async = true;
            s.parentNode.insertBefore(g, s);
            g.onload = function () {
                console.log('VAPI SDK loaded');
                
                // Initialize VAPI with your configuration
                try {
                    vapiInstance = window.vapiSDK.run({
                        apiKey: "af0b8d1c-30fb-4644-ae95-e6b5aec3567c",
                        assistant: "ad8fb8db-1cc3-4162-8ff1-d88d75a1f930",
                        config: {
                            position: "bottom-right",
                            offset: "40px",
                            width: "50px",
                            height: "50px",
                            idle: {
                                color: `rgb(93, 254, 202)`,
                                type: "round",
                                icon: `https://unpkg.com/lucide-static@0.321.0/icons/phone.svg`,
                            },
                            loading: {
                                color: `rgb(93, 124, 202)`,
                                type: "round", 
                                icon: `https://unpkg.com/lucide-static@0.321.0/icons/loader-2.svg`,
                            },
                            active: {
                                color: `rgb(255, 0, 0)`,
                                type: "round",
                                icon: `https://unpkg.com/lucide-static@0.321.0/icons/phone-off.svg`,
                            },
                        }
                    });
                    
                    if (vapiInstance) {
                        console.log('VAPI instance created successfully');
                        isVapiLoaded = true;
                        setupVapiEvents(vapiInstance);
                        vapiStatus.textContent = 'VAPI loaded - Ready to start!';
                        vapiStatus.className = 'vapi-status idle';
                        updateUI();
                    } else {
                        throw new Error('VAPI instance is null');
                    }
                } catch (error) {
                    console.error('Failed to create VAPI instance:', error);
                    vapiStatus.textContent = 'Failed to initialize VAPI: ' + error.message;
                    vapiStatus.className = 'vapi-status error';
                    isVapiLoaded = false;
                    updateUI();
                }
            };
            
            g.onerror = function() {
                console.error('Failed to load VAPI SDK');
                vapiStatus.textContent = 'Failed to load VAPI SDK';
                vapiStatus.className = 'vapi-status error';
                isVapiLoaded = false;
                updateUI();
            };
        })(document, "script");
    </script>
</body>
</html>
