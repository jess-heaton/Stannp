<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stannp Chatbot Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff; /* Changed the background color to white */
            color: #333;
            margin: 0;
            padding: 0;
        }
        main {
            margin: 50px auto;
            max-width: 800px;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        p {
            font-size: 1.1em;
            line-height: 1.6;
            text-align: left;
        }
        a {
            color: #004aad;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
        ul, ol {
            margin-left: 20px;
            text-align: left;
        }
        .bold {
            font-weight: bold;
        }

        /* Styling for the Stripe Buy Button */
        stripe-buy-button {
            display: block;
            margin: 20px auto; /* Center the button */
            text-align: center; /* Ensure it's centered */
        }
    </style>
</head>
<body>
    <main>
        <h1>Stannp Demo</h1>

<!-- Add this div where you want the chatbox to appear -->
<div id="flat-chat" style="width: 80%; height: 600px; border: 1px solid #ccc; border-radius: 12px; overflow: hidden;"></div>

    </main>

<!-- Embedded Chatbox Script -->
<script>
  const FormExtension = {
    name: 'Forms',
    type: 'response',
    match: ({ trace }) =>
      trace.type === 'Custom_Form' || trace.payload.name === 'Custom_Form',
    render: ({ trace, element }) => {
      const formContainer = document.createElement('form');

      formContainer.innerHTML = `
        <style>
          label { font-size: 0.8em; color: #888; }
          input { width: 100%; border: none; border-bottom: 0.5px solid rgba(0,0,0,0.1); background: transparent; margin: 5px 0; padding: 8px 0; outline: none; }
          .submit { background: linear-gradient(to right, #2e6ee1, #2e7ff1); border: none; color: white; padding: 10px; border-radius: 5px; width: 100%; cursor: pointer; }
        </style>
        <label for="name">Name</label><input type="text" class="name" name="name" required><br><br>
        <label for="phone">Phone Number</label><input type="tel" class="phone" name="phone" required><br><br>
        <label for="email">Work Email</label><input type="email" class="email" name="email" required><br><br>
        <label for="company">Company Name</label><input type="text" class="company" name="company" required><br><br>
        <input type="submit" class="submit" value="Submit">
      `;

      formContainer.addEventListener('submit', function (event) {
        event.preventDefault();
        window.voiceflow.chat.interact({
          type: 'complete',
          payload: {
            name: formContainer.querySelector('.name').value,
            phone: formContainer.querySelector('.phone').value,
            email: formContainer.querySelector('.email').value,
            company: formContainer.querySelector('.company').value,
          },
        });
      });

      element.appendChild(formContainer);
    },
  };

  (function (d, t) {
    var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
    v.onload = function () {
      window.voiceflow.chat.load({
        verify: { projectID: '6760adeb289aab95d4721254' },
        url: 'https://general-runtime.voiceflow.com',
        versionID: 'production',
        render: {
          mode: 'embedded',
          target: document.getElementById('flat-chat'),
        },
        assistant: { extensions: [FormExtension] },
      });
    };
    v.src = 'https://cdn.voiceflow.com/widget/bundle.mjs';
    v.type = 'text/javascript';
    s.parentNode.insertBefore(v, s);
  })(document, 'script');
</script>

<script type="text/javascript">
  (function(d, t) {
      var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
      v.onload = function() {
        window.voiceflow.chat.load({
          verify: { projectID: '6760adeb289aab95d4721254' },
          url: 'https://general-runtime.voiceflow.com',
          versionID: 'production'
        });
      }
      v.src = "https://cdn.voiceflow.com/widget/bundle.mjs"; v.type = "text/javascript"; s.parentNode.insertBefore(v, s);
  })(document, 'script');
</script>

</body>
</html>
