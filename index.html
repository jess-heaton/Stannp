<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stannp Chatbot Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff;
            color: #333;
            margin: 0;
            padding: 0;
        }
        main {
            margin: 50px auto;
            max-width: 800px;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
    </style>
</head>
<body>
    <main>
        <h1>Stannp Demo</h1>
        <!-- Embedded Widget Target -->
// Add this div where you want the chatbox to appear

<!-- Place this div wherever you'd like the chat to appear -->
<div id="flat-chat" 
     style="width: 80%; 
            height: 600px; 
            border: 1px solid #ccc; 
            border-radius: 12px; 
            overflow: hidden;">
</div>


    </main>



<script>
// ==============================
// 1) FOLLOW UP FORM EXTENSION
// ==============================
const FollowUpFormExtension = {
  name: 'FollowUpForm',
  type: 'response',
  match: ({ trace }) => trace.type === 'Custom_Form' && trace.payload.formType === 'followUp',
  render: ({ trace, element }) => {
    // Create the container
    const formContainer = document.createElement('form');
    formContainer.innerHTML = `
      <style>
        label {
          font-size: 0.8em;
          color: #888;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"] {
          width: 100%;
          border: none;
          border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
          background: transparent;
          margin: 5px 0;
          outline: none;
          padding: 8px 0;
        }
        .invalid {
          border-color: red;
        }
        .submit {
          background: linear-gradient(to right, #2e6ee1, #2e7ff1);
          border: none;
          color: white;
          padding: 10px;
          border-radius: 5px;
          width: 100%;
          cursor: pointer;
        }
      </style>

      <label for="name">Name</label>
      <input type="text" class="name" name="name" required><br><br>

      <label for="phone">Phone Number</label>
      <input type="tel" class="phone" name="phone" 
             required pattern="\\+?[0-9\\- ]+" 
             title="Invalid phone number"><br><br>

      <label for="email">Work Email</label>
      <input type="email" class="email" name="email" 
             required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\\.[a-z]{2,}$" 
             title="Invalid email address"><br><br>

      <label for="company">Company Name</label>
      <input type="text" class="company" name="company" required><br><br>

      <input type="submit" class="submit" value="Submit">
    `;

    // Handle form submission
    formContainer.addEventListener('submit', function (event) {
      event.preventDefault();

      const name = formContainer.querySelector('.name').value;
      const phone = formContainer.querySelector('.phone').value;
      const email = formContainer.querySelector('.email').value;
      const company = formContainer.querySelector('.company').value;

      // Pass data back into Voiceflow
      window.voiceflow.chat.interact({
        type: 'complete',
        payload: {
          name,
          phone,
          email,
          company,
        },
      });
    });

    element.appendChild(formContainer);
  },
};

// ==============================
// 2) REQUEST SAMPLES FORM
// ==============================
const SamplesFormExtension = {
  name: 'SamplesForm',
  type: 'response',
  match: ({ trace }) => trace.type === 'Custom_Form' && trace.payload.formType === 'requestSamples',
  render: ({ trace, element }) => {
    const formContainer = document.createElement('form');

    formContainer.innerHTML = `
      <style>
        label {
          font-size: 0.8em;
          color: #888;
        }
        input[type="text"] {
          width: 100%;
          border: none;
          border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
          background: transparent;
          margin: 5px 0;
          outline: none;
          padding: 8px 0;
        }
        .invalid {
          border-color: red;
        }
        .submit {
          background: linear-gradient(to right, #2e6ee1, #2e7ff1);
          border: none;
          color: white;
          padding: 10px;
          border-radius: 5px;
          width: 100%;
          cursor: pointer;
        }
      </style>

      <label for="name">Name</label>
      <input type="text" class="name" name="name" required><br><br>

      <label for="postal">Postal Address</label>
      <input type="text" class="postal" name="postal" required><br><br>

      <label for="company">Company Name</label>
      <input type="text" class="company" name="company" required><br><br>

      <input type="submit" class="submit" value="Submit">
    `;

    // Handle form submission
    formContainer.addEventListener('submit', function (event) {
      event.preventDefault();

      const name = formContainer.querySelector('.name').value;
      const postal = formContainer.querySelector('.postal').value;
      const company = formContainer.querySelector('.company').value;

      window.voiceflow.chat.interact({
        type: 'complete',
        payload: {
          name,
          postal,
          company,
        },
      });
    });

    element.appendChild(formContainer);
  },
};

// ==============================
// 3) SCHEDULE DEMO FORM
//    (uses date/time inputs)
// ==============================
const ScheduleDemoFormExtension = {
  name: 'ScheduleDemoForm',
  type: 'response',
  match: ({ trace }) => trace.type === 'Custom_Form' && trace.payload.formType === 'scheduleDemo',
  render: ({ trace, element }) => {
    // We'll combine the same style approach but add a datetime-local field 
    // (similar to your DateExtension code).
    const formContainer = document.createElement('form');

    // Calculate min and max date if you want to replicate the 
    // dynamic approach from your DateExtension
    let currentDate = new Date();
    let minDate = new Date();
    minDate.setMonth(currentDate.getMonth() - 1);
    let maxDate = new Date();
    maxDate.setMonth(currentDate.getMonth() + 2);

    let minDateString = minDate.toISOString().slice(0, 16);
    let maxDateString = maxDate.toISOString().slice(0, 16);

    formContainer.innerHTML = `
      <style>
        label {
          font-size: 0.8em;
          color: #888;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="datetime-local"] {
          width: 100%;
          border: none;
          border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
          background: transparent;
          margin: 5px 0;
          outline: none;
          padding: 8px 0;
        }
        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
          border: none;
          background: transparent;
          border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
          outline: none;
          color: transparent;
          cursor: pointer;
          height: auto;
          position: relative;
          padding:6px;
        }
        .invalid {
          border-color: red;
        }
        .submit {
          background: linear-gradient(to right, #2e6ee1, #2e7ff1);
          border: none;
          color: white;
          padding: 10px;
          border-radius: 5px;
          width: 100%;
          cursor: pointer;
        }
      </style>

      <!-- Date/Time -->
      <label for="datetime">Select your date/time</label>
      <input type="datetime-local" id="datetime" name="datetime"
             min="${minDateString}" max="${maxDateString}"
             required><br><br>

      <!-- Name -->
      <label for="name">Name</label>
      <input type="text" class="name" name="name" required><br><br>

      <!-- Company -->
      <label for="company">Company Name</label>
      <input type="text" class="company" name="company" required><br><br>

      <!-- Email -->
      <label for="email">Email</label>
      <input type="email" class="email" name="email"
             required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\\.[a-z]{2,}$"
             title="Invalid email address"><br><br>

      <!-- Phone -->
      <label for="phone">Phone Number</label>
      <input type="tel" class="phone" name="phone"
             required pattern="\\+?[0-9\\- ]+"
             title="Invalid phone number"><br><br>

      <input type="submit" class="submit" value="Submit">
    `;

    // Handle form submission
    formContainer.addEventListener('submit', function (event) {
      event.preventDefault();
      const datetime = formContainer.querySelector('#datetime').value;
      let [date, time] = datetime.split('T') || ['', ''];

      const name = formContainer.querySelector('.name').value;
      const company = formContainer.querySelector('.company').value;
      const email = formContainer.querySelector('.email').value;
      const phone = formContainer.querySelector('.phone').value;

      // Send it all back
      window.voiceflow.chat.interact({
        type: 'complete',
        payload: { date, time, name, company, email, phone },
      });
    });

    element.appendChild(formContainer);
  },
};

// ==============================
// 4) OPTIONAL DATE EXTENSION
//    (If you prefer separate trace 
//     steps just for date/time.)
// ==============================
export const DateExtension = {
  name: 'Date',
  type: 'response',
  match: ({ trace }) => 
    trace.type === 'ext_date' || trace.payload.name === 'ext_date',
  render: ({ trace, element }) => {
    const formContainer = document.createElement('form')

    // Get current date and time
    let currentDate = new Date()
    let minDate = new Date()
    minDate.setMonth(currentDate.getMonth() - 1)
    let maxDate = new Date()
    maxDate.setMonth(currentDate.getMonth() + 2)

    // Convert to ISO string and remove seconds/millis
    let minDateString = minDate.toISOString().slice(0, 16)
    let maxDateString = maxDate.toISOString().slice(0, 16)

    formContainer.innerHTML = `
      <style>
        label {
          font-size: 0.8em;
          color: #888;
        }
        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
          border: none;
          background: transparent;
          border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
          outline: none;
          color: transparent;
          cursor: pointer;
          height: auto;
          position: absolute;
          padding:6px;
          font: normal 8px sans-serif;
        }
        .meeting input{
          background: transparent;
          border: none;
          padding: 2px;
          border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
          font: normal 14px sans-serif;
          outline:none;
          margin: 5px 0;
        }
        .invalid {
          border-color: red;
        }
        .submit {
          background: linear-gradient(to right, #2e6ee1, #2e7ff1 );
          border: none;
          color: white;
          padding: 10px;
          border-radius: 5px;
          width: 100%;
          cursor: pointer;
          opacity: 0.3;
        }
        .submit:enabled {
          opacity: 1; /* Make the button fully opaque when it's enabled */
        }
      </style>

      <label for="date">Select your date/time</label><br>
      <div class="meeting">
        <input type="datetime-local"
               id="meeting"
               name="meeting"
               min="${minDateString}"
               max="${maxDateString}" />
      </div><br>
      <input type="submit" id="submit" class="submit" value="Submit" disabled="disabled">
    `

    const submitButton = formContainer.querySelector('#submit')
    const datetimeInput = formContainer.querySelector('#meeting')

    // Enable/disable logic
    datetimeInput.addEventListener('input', function () {
      if (this.value) {
        submitButton.disabled = false
      } else {
        submitButton.disabled = true
      }
    })

    // On form submission
    formContainer.addEventListener('submit', function (event) {
      event.preventDefault()
      const datetime = datetimeInput.value
      let [date, time] = datetime.split('T')

      // Remove button (optional)
      formContainer.querySelector('.submit').remove()

      window.voiceflow.chat.interact({
        type: 'complete',
        payload: { date, time },
      })
    })

    element.appendChild(formContainer)
  },
};

// ==============================
// 5) EMBEDDED CHAT LOADER
// ==============================
(function (d, t) {
  var v = d.createElement(t),
      s = d.getElementsByTagName(t)[0];
  v.onload = function () {
    window.voiceflow.chat.load({
      verify: { projectID: '6788c212a009f3b7ee57911b' }, // <-- UPDATED PROJECT ID
      url: 'https://general-runtime.voiceflow.com',
      versionID: 'production',
      render: {
        mode: 'embedded',
        target: document.getElementById('flat-chat'),
      },
      autostart: true,
      // Add all your extensions here
      assistant: { 
        extensions: [
          FollowUpFormExtension, 
          SamplesFormExtension,
          ScheduleDemoFormExtension,
          DateExtension
        ] 
      },
    });
  };
  v.src = 'https://cdn.voiceflow.com/widget/bundle.mjs';
  v.type = 'text/javascript';
  s.parentNode.insertBefore(v, s);
})(document, 'script');
</script>
</body>
</html>
