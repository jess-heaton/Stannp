<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stannp Chatbot Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff;
      color: #333;
      margin: 0;
      padding: 0;
    }
    main {
      margin: 50px auto;
      max-width: 800px;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    /* Optional styling for the container */
    #flat-chat {
      width: 80%;
      height: 600px;
      border: 1px solid #ccc;
      border-radius: 12px;
      overflow: hidden;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <main>
    <h1>Stannp Demo</h1>

    <!-- Chat widget container -->
    <div id="flat-chat"></div>

  </main>

<script>
const MultiFormsExtension = {
  name: 'Forms',
  type: 'response',
  match: ({ trace }) =>
    trace.type === 'ext_form' || trace.payload.name === 'ext_form',

  render: ({ trace, element }) => {
    // We'll assume Voiceflow is sending something like:
    // { type: 'ext_form', payload: { formType: 'followUp' } } 
    // or { type: 'ext_form', payload: { formType: 'requestSamples' } }
    // or { type: 'ext_form', payload: { formType: 'scheduleDemo' } }
    
    const { formType } = trace.payload || {};

    // We'll create a function that builds the correct HTML form
    // depending on formType
    let formHTML = '';
    let formCSS = `
      <style>
        label {
          font-size: 0.8em;
          color: #888;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="datetime-local"] {
          width: 100%;
          border: none;
          border-bottom: 0.5px solid rgba(0,0,0,.1);
          background: transparent;
          margin: 5px 0;
          outline: none;
          padding: 8px 0;
        }
        .submit {
          background: linear-gradient(to right, #2e6ee1, #2e7ff1);
          border: none;
          color: white;
          padding: 10px;
          border-radius: 5px;
          width: 100%;
          cursor: pointer;
        }
      </style>`;

    if (formType === 'followUp') {
      // ~~~~~~~~~~~~~~~~~~~
      // Build Follow-Up Form
      // ~~~~~~~~~~~~~~~~~~~
      formHTML = `
        ${formCSS}
        <label for="name">Name</label>
        <input type="text" class="name" required><br><br>

        <label for="phone">Phone Number</label>
        <input type="tel" class="phone" required pattern="\\+?[0-9\\- ]+" title="Invalid phone number"><br><br>

        <label for="email">Work Email</label>
        <input type="email" class="email" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\\.[a-z]{2,}$" title="Invalid email"><br><br>

        <label for="company">Company Name</label>
        <input type="text" class="company" required><br><br>

        <input type="submit" class="submit" value="Submit">
      `;
    } 
    else if (formType === 'requestSamples') {
      // ~~~~~~~~~~~~~~~~~~~~~~
      // Build Request Samples
      // ~~~~~~~~~~~~~~~~~~~~~~
      formHTML = `
        ${formCSS}
        <label for="name">Name</label>
        <input type="text" class="name" required><br><br>

        <label for="postal">Postal Address</label>
        <input type="text" class="postal" required><br><br>

        <label for="company">Company Name</label>
        <input type="text" class="company" required><br><br>

        <input type="submit" class="submit" value="Submit">
      `;
    }
    else if (formType === 'scheduleDemo') {
      // ~~~~~~~~~~~~~~~~~~~~
      // Build Schedule Demo
      // ~~~~~~~~~~~~~~~~~~~~
      // Optionally set some min/max date logic
      let currentDate = new Date();
      let minDate = new Date();
      minDate.setMonth(currentDate.getMonth() - 1);
      let maxDate = new Date();
      maxDate.setMonth(currentDate.getMonth() + 2);
      const minDateString = minDate.toISOString().slice(0, 16);
      const maxDateString = maxDate.toISOString().slice(0, 16);

      formHTML = `
        ${formCSS}
        <label for="datetime">Select your date/time</label>
        <input type="datetime-local" id="datetime" name="datetime"
               min="${minDateString}" max="${maxDateString}" required><br><br>

        <label for="name">Name</label>
        <input type="text" class="name" required><br><br>

        <label for="company">Company Name</label>
        <input type="text" class="company" required><br><br>

        <label for="email">Email</label>
        <input type="email" class="email" required pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\\.[a-z]{2,}$"><br><br>

        <label for="phone">Phone Number</label>
        <input type="tel" class="phone" required pattern="\\+?[0-9\\- ]+"><br><br>

        <input type="submit" class="submit" value="Submit">
      `;
    }
    else {
      // No recognized formType
      formHTML = '<div>Form Type not recognized.</div>';
    }

    // Insert that HTML
    const formContainer = document.createElement('form');
    formContainer.innerHTML = formHTML;
    
    // On SUBMIT:
    formContainer.addEventListener('submit', function (event) {
      event.preventDefault();

      // Grab all your fields
      const name = formContainer.querySelector('.name')?.value || '';
      const email = formContainer.querySelector('.email')?.value || '';
      const phone = formContainer.querySelector('.phone')?.value || '';
      const company = formContainer.querySelector('.company')?.value || '';
      const postal = formContainer.querySelector('.postal')?.value || '';
      const datetimeValue = formContainer.querySelector('#datetime')?.value || '';
      // If datetimeValue has 'T', separate out date + time
      let [date, time] = datetimeValue.split('T') || ['', ''];

      // Send data back to Voiceflow
      window.voiceflow.chat.interact({
        type: 'complete',
        payload: {
          formType,
          name,
          email,
          phone,
          company,
          postal,
          date,
          time
        },
      });
    });

    // Finally, attach to the chat element
    element.appendChild(formContainer);
  }
};

// Then, load the widget:
(function (d, t) {
  var v = d.createElement(t),
    s = d.getElementsByTagName(t)[0];
  v.onload = function () {
    window.voiceflow.chat.load({
      verify: { projectID: 'YOUR_PROJECT_ID' },
      url: 'https://general-runtime.voiceflow.com',
      versionID: 'production',
      render: {
        mode: 'embedded',
        target: document.getElementById('flat-chat'),
      },
      autostart: true,
      assistant: {
        extensions: [MultiFormsExtension],
      },
    });
  };
  v.src = 'https://cdn.voiceflow.com/widget/bundle.mjs';
  v.type = 'text/javascript';
  s.parentNode.insertBefore(v, s);
})(document, 'script');
</script>
</body>
</html>
